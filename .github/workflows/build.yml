name: Сборка exe

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка
        run: pyinstaller --onefile --console --name monitoring-zp main.py

      - name: Проверка запуска
        run: dist\monitoring-zp.exe --help

      - name: Публикация в Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${GITHUB_RUN_NUMBER}" dist/monitoring-zp.exe \
            --target "$GITHUB_SHA" \
            --title "Мониторинг зарплат, сборка ${GITHUB_RUN_NUMBER}" \
            --latest \
            --notes "Скачайте monitoring-zp.exe, положите в отдельную папку и запустите двойным щелчком. Python не нужен. Рядом с программой появится файл «Мониторинг зарплат.xlsx» с отчётом."
